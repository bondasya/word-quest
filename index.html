<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Word Quest Spotlight 4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Comfortaa:wght@700&family=Nunito:wght@600;800;900&family=Rubik:wght@500;700;800&display=swap">
<style>
/* Layout: one bright column (max 720px): scene banner + reward board, colourful mission tiles, parent report. Game screens replace the hub. */
:root{
  --sky1:#5cc8ff; --sky2:#c8f0ff; --panel:#ffffff; --ink:#24304a; --muted:#5d6b85; --line:#d9e2f0;
  --accent:#ff7a1a; --accent-ink:#fff; --accent-sh:#c95600; --gold:#ffc61a; --good:#22b04b; --bad:#ff4d4d;
  --display:"Rubik",system-ui,sans-serif; --body:"Rubik",system-ui,sans-serif; --radius:16px;
  color-scheme:light;
}
/* Mine world: sunny pixel daylight, single bright look */
[data-world="mine"]{
  --sky1:#45b6ff; --sky2:#bdeaff; --panel:#fffaf0; --ink:#1e140a; --muted:#4a3820; --line:#3b2a1a;
  --accent:#4fc71f; --accent-ink:#fff; --accent-sh:#2e7d10; --gold:#ffd21f; --good:#1f9a2b; --bad:#d92b1f;
  --display:"Rubik",system-ui,sans-serif; --title:"Rubik",system-ui,sans-serif; --body:"Rubik",system-ui,sans-serif; --radius:6px;
}
/* Bakery world: candy-bright pastel, single bright look */
[data-world="bake"]{
  --sky1:#ff8fc0; --sky2:#ffe1b8; --panel:#ffffff; --ink:#3a0f28; --muted:#6e3355; --line:#ffc2dc;
  --accent:#ff3d8b; --accent-ink:#fff; --accent-sh:#c4145e; --gold:#ffb703; --good:#0b8a63; --bad:#d6264a;
  --display:"Nunito",system-ui,sans-serif; --title:"Comfortaa","Nunito",sans-serif; --body:"Nunito",system-ui,sans-serif; --radius:24px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{background:linear-gradient(180deg,var(--sky1),var(--sky2)) fixed;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;overflow-x:hidden}
[data-world="mine"] body{background:
  linear-gradient(180deg,#3fb0ff 0,#9edcff 55%,#c9f1ff 100%) fixed}
[data-world="bake"] body{background:
  radial-gradient(circle at 12% 18%,#fff 0 3px,transparent 4px) 0 0/46px 46px,
  radial-gradient(circle at 70% 60%,#ffe14d 0 3px,transparent 4px) 0 0/58px 58px,
  radial-gradient(circle at 40% 80%,#7de2c3 0 3px,transparent 4px) 0 0/52px 52px,
  linear-gradient(160deg,#ff9ccc,#ffc7a6 55%,#fff0a8) fixed}
#app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px;position:relative}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:clamp(30px,7vw,46px)} h2{font-size:24px} h3{font-size:20px}
p{margin:0}
img{display:block}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.ico{width:1.5em;height:1.5em;display:inline-block;vertical-align:middle}

/* Buttons */
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:14px 22px;border-radius:var(--radius);font-weight:800;font-size:19px;font-family:var(--display);
  box-shadow:0 5px 0 var(--accent-sh);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-sh)}
.btn.ghost{background:var(--panel);color:var(--ink);box-shadow:0 5px 0 var(--line)}
[data-world="mine"] .btn{border:3px solid #1e3d0b;text-shadow:0 2px 0 rgba(0,0,0,.4);background:#2f9e12}
[data-world="mine"] .btn.ghost{border-color:var(--line);background:#fff7df;text-shadow:none;box-shadow:0 5px 0 #a98a5c}
.btn.wide{width:100%}

.panel{background:var(--panel);border-radius:var(--radius);padding:18px;box-shadow:0 8px 0 rgba(0,0,0,.08)}
[data-world="mine"] .panel{border:4px solid var(--line);box-shadow:inset 0 0 0 4px #ffe9b0,0 6px 0 rgba(0,0,0,.18)}
[data-world="bake"] .panel{border:4px solid #fff;box-shadow:0 0 0 4px var(--line),0 10px 24px rgba(214,40,110,.18)}

/* Scene banner */
.scene{position:relative;min-height:64px;border-radius:var(--radius);overflow:hidden;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px 18px}
@media (max-width:560px){.scene > img{display:none!important}}
.scene .hud{position:relative;z-index:3;display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.scene .chip{font-size:16px;padding:3px 10px 3px 5px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.scene .chip img{width:22px;height:22px}
[data-world="mine"] .scene{background:linear-gradient(#56c1ff,#b8ecff 70%);border:4px solid var(--line)}
[data-world="mine"] .scene::after{content:none;position:absolute;left:0;right:0;bottom:0;height:42px;
  background:linear-gradient(#5fd02c 0 14px,#3fa516 14px 18px,#8a5a2b 18px) ;
  -webkit-mask:linear-gradient(#000,#000);}
[data-world="mine"] .scene .dirt{position:absolute;left:0;right:0;bottom:0;height:8px;z-index:1;
  background:repeating-linear-gradient(90deg,#8a5a2b 0 16px,#7a4d22 16px 32px)}
[data-world="mine"] .scene .grass{position:absolute;left:0;right:0;bottom:8px;height:8px;z-index:1;
  background:repeating-linear-gradient(90deg,#62d22f 0 16px,#52bf22 16px 32px)}
[data-world="bake"] .scene{background:linear-gradient(120deg,#ffd6ea,#fff1c9);border:4px solid #fff;box-shadow:0 0 0 4px var(--line)}
[data-world="bake"] .scene::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;z-index:1;
  background:radial-gradient(circle at 10px 0,transparent 9px,#ff6fae 10px) 0 0/20px 12px}
.scene > img{position:absolute;z-index:2;filter:drop-shadow(0 4px 4px rgba(0,0,0,.18))}
.scene .title{position:relative;z-index:3;font-family:var(--title,var(--display));background:rgba(0,0,0,.35);padding:4px 12px;border-radius:10px;font-size:clamp(15px,3.8vw,19px);line-height:1.25;max-width:100%;font-weight:800;color:#fff;
  text-shadow:3px 3px 0 rgba(0,0,0,.28)}
[data-world="bake"] .scene .title{color:#fff;background:#d81b6a;text-shadow:none}
.float{animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}

/* Start */
.start-head{text-align:center;display:grid;gap:8px;padding:14px;color:#0d2a4a;background:rgba(255,255,255,.85);border-radius:20px}
.start-head h1{font-size:clamp(34px,9vw,52px);color:#ff6a00}
.start-head p{font-weight:700;font-size:18px}
.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.world-card{border:0;text-align:left;padding:0;display:grid;border-radius:22px;overflow:hidden;position:relative;transition:transform .15s}
.world-card:hover{transform:translateY(-4px) rotate(-.5deg)}
.world-card .art{height:190px;position:relative}
.world-card .art img{position:absolute;filter:drop-shadow(0 6px 6px rgba(0,0,0,.2))}
.world-card .cap{padding:16px 18px 20px;display:grid;gap:4px}
.world-card b{font-size:26px;color:#111}
.world-card.mine{border-radius:6px;border:5px solid #3b2a1a;background:#fff7df;font-family:"Rubik",sans-serif;font-weight:800;color:#2b1d10}
.world-card.mine .art{background:linear-gradient(#45b6ff,#bdeaff 70%)}
.world-card.mine .art::after{content:"";position:absolute;inset:auto 0 0 0;height:40px;background:linear-gradient(#62d22f 0 16px,#8a5a2b 16px)}
.world-card.bake{background:#fff;font-family:"Comfortaa",sans-serif;color:#55203f;border:5px solid #fff;box-shadow:0 0 0 5px #ffc2dc}
.world-card.bake .art{background:linear-gradient(140deg,#ff9ccc,#ffd9a8)}
.world-card span{font-family:"Rubik",sans-serif;font-size:17px;color:#333;font-weight:600}
.world-card.bake span{font-family:"Nunito",sans-serif;font-weight:700}

/* Hub top */
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px 6px 8px;border-radius:999px;background:var(--panel);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.chip img{width:30px;height:30px}
[data-world="mine"] .chip{border-radius:4px;border:3px solid var(--line)}
.bar{height:18px;background:#e7ecf5;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#3ee07a,#22b04b);transition:width .5s}
[data-world="mine"] .bar{border-radius:0;border:3px solid var(--line);background:#5a4630}
[data-world="mine"] .bar>i{background:repeating-linear-gradient(90deg,#7dff4a 0 12px,#4fc71f 12px 16px)}
[data-world="bake"] .bar>i{background:repeating-linear-gradient(45deg,#ff5fa2 0 10px,#ff8cc0 10px 20px)}

/* Reward boards */
.board-wrap{display:grid;grid-template-columns:1fr;gap:10px}
/* Estate: shared house, each unit adds a part (13x14 grid: rows 0-8 sky, 9 ground, 10-13 underground) */
.estate{display:grid;flex:0 0 auto;border:4px solid var(--line);border-radius:6px;overflow:hidden;background:linear-gradient(#7ccfff,#c6efff)}
[data-world="bake"] .estate{border-color:#ff8cc0;border-radius:16px;background:linear-gradient(#ffd6ea,#fff4d6)}
.cell.ground{background:linear-gradient(#62d22f 0 40%,#8a5a2b 40%)}
.cell.under{background:#6b4423}
[data-world="bake"] .cell.ground{background:linear-gradient(#7de2c3 0 40%,#8b4a2b 40%)}
[data-world="bake"] .cell.under{background:#6b351c}
.board-body{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.board-body .parts{flex:1 1 200px;min-width:0;margin-top:0}
.cell{aspect-ratio:1;position:relative;display:grid;place-items:center;min-width:0}
.cell img{width:78%;height:78%;object-fit:contain}
.cell.ghost{outline:2px dashed rgba(255,255,255,.95);outline-offset:-3px;background:rgba(255,255,255,.22)}
.cell.ghost.cur{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{background:rgba(255,255,255,.5)}}
.cell.on{box-shadow:inset -3px -3px 0 rgba(0,0,0,.22),inset 3px 3px 0 rgba(255,255,255,.28)}
.cell.on.new{animation:pop .5s}
/* mine textures */
[data-world="mine"] .cell.on.W{background:repeating-linear-gradient(0deg,#e0a55e 0 7px,#c98a40 7px 9px)}
[data-world="mine"] .cell.on.G{background:linear-gradient(135deg,#e9fbff 40%,#9fe6ff 40% 60%,#e9fbff 60%);box-shadow:inset 0 0 0 3px #c98a40}
[data-world="mine"] .cell.on.D{background:linear-gradient(90deg,#8a5a2b 42%,#ffd21f 42% 58%,#8a5a2b 58%)}
[data-world="mine"] .cell.on.S{background:repeating-conic-gradient(#a7adb4 0 25%,#8f959c 0 50%) 0 0/10px 10px}
[data-world="mine"] .cell.on.R{background:repeating-linear-gradient(45deg,#e8452c 0 5px,#c4321c 5px 10px)}
[data-world="mine"] .cell.on.B{background:repeating-linear-gradient(0deg,#b5482f 0 6px,#e8d8c8 6px 7px)}
[data-world="mine"] .cell.on.L{background:repeating-conic-gradient(#3fae2a 0 25%,#2f8f1e 0 50%) 0 0/8px 8px}
[data-world="mine"] .cell.on.T{background:repeating-linear-gradient(90deg,#7a5230 0 5px,#5e3c1c 5px 7px)}
[data-world="mine"] .cell.on.F{background:radial-gradient(circle,#ff3d6e 0 22%,#ffd21f 23% 30%,transparent 31%),#62d22f}
[data-world="mine"] .cell.on.H{background:repeating-conic-gradient(#2f8f1e 0 25%,#247316 0 50%) 0 0/10px 10px}
[data-world="mine"] .cell.on.C{background:repeating-conic-gradient(#8f959c 0 25%,#6f757c 0 50%) 0 0/7px 7px}
[data-world="mine"] .cell.on.Au{background:repeating-conic-gradient(#ffe066 0 25%,#ffc61a 0 50%) 0 0/10px 10px}
[data-world="mine"] .cell.on.O1{background:radial-gradient(circle at 30% 30%,#5ff2ff 0 14%,transparent 15%),radial-gradient(circle at 70% 65%,#5ff2ff 0 14%,transparent 15%),#7a7e83}
[data-world="mine"] .cell.on.O2{background:radial-gradient(circle at 30% 60%,#ffd21f 0 14%,transparent 15%),radial-gradient(circle at 70% 30%,#ffd21f 0 14%,transparent 15%),#7a7e83}
[data-world="mine"] .cell.on.O3{background:radial-gradient(circle at 35% 35%,#2fe06a 0 14%,transparent 15%),radial-gradient(circle at 68% 68%,#2fe06a 0 14%,transparent 15%),#7a7e83}
[data-world="mine"] .cell.on.O4{background:radial-gradient(circle at 30% 70%,#ff3b2f 0 14%,transparent 15%),radial-gradient(circle at 66% 32%,#ff3b2f 0 14%,transparent 15%),#7a7e83}
[data-world="mine"] .cell.on.O5{background:radial-gradient(circle at 40% 40%,#3a5cff 0 14%,transparent 15%),radial-gradient(circle at 72% 70%,#3a5cff 0 14%,transparent 15%),#7a7e83}
/* bakery textures */
[data-world="bake"] .cell.on{box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
[data-world="bake"] .cell.on.W{background:repeating-linear-gradient(90deg,#ffb3d1 0 6px,#ffc9de 6px 12px)}
[data-world="bake"] .cell.on.G{background:#fff;box-shadow:inset 0 0 0 3px #ff8cc0}
[data-world="bake"] .cell.on.D{background:linear-gradient(#7a3b1d,#5a2810);border-radius:40% 40% 0 0}
[data-world="bake"] .cell.on.S{background:repeating-linear-gradient(45deg,#f2c27a 0 4px,#e3a956 4px 8px)}
[data-world="bake"] .cell.on.R{background:radial-gradient(circle at 50% 0,#fff 0 45%,transparent 46%),#ff4f8b}
[data-world="bake"] .cell.on.B{background:repeating-linear-gradient(45deg,#fff 0 4px,#ff3d6e 4px 8px)}
[data-world="bake"] .cell.on.L{background:radial-gradient(circle at 40% 40%,#ffd1ec 0 30%,#ff9fd2 31%);border-radius:40%}
[data-world="bake"] .cell.on.T{background:linear-gradient(90deg,transparent 30%,#fff 30% 70%,transparent 70%);box-shadow:none}
[data-world="bake"] .cell.on.F,[data-world="bake"] .cell.on.O1,[data-world="bake"] .cell.on.O2,[data-world="bake"] .cell.on.O3,[data-world="bake"] .cell.on.O4,[data-world="bake"] .cell.on.O5{background:transparent;box-shadow:none}
[data-world="bake"] .cell.on.H{background:radial-gradient(circle,#c9f7e6 0 55%,#8fe3c6 56%);border-radius:50%}
[data-world="bake"] .cell.on.C{background:repeating-linear-gradient(0deg,#f5c16c 0 3px,#e09b3d 3px 4px),#f5c16c;background-blend-mode:multiply}
[data-world="bake"] .cell.on.Au{background:radial-gradient(circle at 30% 30%,#ff3d6e 0 10%,transparent 11%),radial-gradient(circle at 70% 60%,#3fa9f5 0 10%,transparent 11%),radial-gradient(circle at 40% 75%,#ffd21f 0 10%,transparent 11%),#fff}
.parts{display:grid;gap:6px;margin-top:6px}
.part{display:flex;gap:10px;align-items:center;font-weight:700;font-size:15px}
.part i{font-style:normal;font-weight:900;margin-left:auto;font-variant-numeric:tabular-nums}
.part.locked{color:var(--muted)}
.part.cur{color:var(--ink)}
.part .dot{width:14px;height:14px;border-radius:4px;background:var(--line);flex:0 0 auto}
.part.done .dot{background:var(--good)} .part.cur .dot{background:var(--gold)}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.2)}100%{transform:scale(1)}}

[hidden]{display:none!important}
.tagline{margin:-6px 0 -4px;font-weight:800;font-size:16px;color:#0d2a4a;background:rgba(255,255,255,.75);padding:6px 12px;border-radius:12px;width:fit-content;max-width:100%}
[data-world="bake"] .tagline{color:#5a1638}
.gate{display:grid;gap:12px;max-width:460px;margin:0 auto;width:100%}
.gate .type{text-transform:uppercase;letter-spacing:.1em}
.gate-msg{background:#fff1f1;border:3px solid #ff8a8a;color:#7a1010;border-radius:12px;padding:10px 12px;font-weight:700}
.warn{background:#fff3c4;border:3px solid #ffc61a;color:#4a3000;border-radius:12px;padding:8px 12px;font-weight:800}
.chip.name{padding-left:12px}
.rewards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.reward{display:grid;justify-items:center;text-align:center;gap:6px;padding:12px 8px;border-radius:14px;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.1);border:3px solid #ffd21f}
[data-world="mine"] .reward{border-color:#3b2a1a;border-radius:6px}
.reward img{width:64px;height:64px}
.reward b{font-size:15px;line-height:1.2;min-height:2.4em;display:grid;place-items:center}
.reward small{font-weight:800;font-size:13px;color:var(--muted)}
.reward small.can{color:var(--good)}
.reward.lack{border-color:#e3e3e3}
.reward.lack img{filter:grayscale(.6);opacity:.75}
.buy{border:0;border-radius:999px;padding:6px 14px 6px 8px;font-weight:900;font-size:17px;background:var(--gold);color:#4a3000;box-shadow:0 4px 0 #c99400;display:inline-flex;align-items:center;gap:4px}
.buy img{width:24px;height:24px}
.buy:disabled{background:#eceff4;color:#7b8494;box-shadow:0 4px 0 #cfd5df;cursor:default}
.buy.sure{background:var(--good);color:#fff;box-shadow:0 4px 0 #116b22}
.edit-top{padding:6px 12px;font-size:15px}
.coupons{display:grid;gap:8px;margin-top:8px}
.coupon{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:repeating-linear-gradient(45deg,#fff8d6 0 12px,#fff 12px 24px);border:3px dashed #ffb703}
.coupon img{width:44px;height:44px}.coupon span{flex:1;display:grid}.coupon small{color:var(--muted);font-weight:700}
.coupon .btn{padding:8px 14px;font-size:16px}
.pinbox{display:grid;gap:10px;margin-top:12px;padding:12px;border-radius:14px;background:#eef6ff;border:3px solid #9cc7ff}
.pz{display:grid;gap:10px;margin-top:14px;padding-top:12px;border-top:2px dashed #ddd}
.redit{display:grid;gap:8px}
.rrow{display:flex;gap:6px;align-items:center}
.rrow .type.rname{flex:1 1 auto;min-width:0;padding:8px 10px}.rrow .type.rprice{flex:0 0 66px;width:66px;padding:8px 6px;text-align:center}
.rrow .rdel{padding:6px 10px}
.rrow .btn{padding:8px 12px;font-size:16px}
.iconpick{border:2px dashed #bbb;background:#fff;border-radius:10px;padding:2px;flex:0 0 auto}
.iconpick img,.iconpick .noimg{width:36px;height:36px}
.hist{margin:0;padding-left:20px;font-size:14px}
/* Units */
.units{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.unit{flex:0 0 auto;display:flex;align-items:baseline;gap:6px;text-align:left;padding:7px 12px;border:0;border-radius:var(--radius);background:var(--panel);box-shadow:0 4px 0 rgba(0,0,0,.15);color:var(--ink)}
.unit b{font-size:16px;font-weight:900}.unit small{font-size:13px;color:var(--muted);font-weight:700;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit i{font-style:normal;font-weight:900;color:var(--good);font-size:14px}
.unit.cur{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-sh)}.unit.cur small,.unit.cur i{color:#fff}
.unit.add{background:rgba(255,255,255,.6);border:3px dashed var(--accent);box-shadow:none}
.type.small{font-size:17px;font-weight:700;padding:10px 12px;text-align:left;border-width:3px;flex:1;min-width:0}
textarea.type.small{resize:vertical;font-family:var(--body)}
.noimg{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:30%;font-weight:900;color:#fff;font-family:"Rubik",sans-serif}
.noimg.h0{background:#1f78d1}.noimg.h1{background:#d81b6a}.noimg.h2{background:#2b8f10}.noimg.h3{background:#d96500}.noimg.h4{background:#7b3fe0}.noimg.h5{background:#0e8c80}
.pic.noimg{font-size:84px;width:150px;height:150px}
td .noimg{width:28px;height:28px;font-size:15px}
.newlist .noimg{width:30px;height:30px;font-size:16px}

/* Missions */
.missions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:480px){.missions{grid-template-columns:1fr}}
.mission{position:relative;display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;text-align:left;border:0;padding:14px;border-radius:var(--radius);
  color:#fff;background:var(--mc);box-shadow:0 6px 0 var(--ms);transition:transform .1s}
.mission:hover{transform:translateY(-3px)}
.mission:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ms)}
.mission img{width:64px;height:64px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.25))}
.mission b{font-family:var(--display);font-size:21px;font-weight:800;display:block;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.mission small{font-size:15px;font-weight:700;display:block;text-shadow:0 1px 0 rgba(0,0,0,.25)}
[data-world="mine"] .mission{border:4px solid rgba(0,0,0,.5)}
.badge{position:absolute;top:-10px;right:10px;font-size:13px;font-weight:900;background:var(--gold);color:#4a3000;padding:3px 10px;border-radius:999px;
  box-shadow:0 3px 0 rgba(0,0,0,.2);animation:wig 1.4s ease-in-out infinite;font-family:var(--body)}
@keyframes wig{50%{transform:rotate(-4deg) scale(1.08)}}

/* Game screen */
.gtop{display:flex;align-items:center;gap:10px}
.gtop .btn{padding:8px 14px;font-size:18px}
.qcard{text-align:center;display:grid;gap:10px;justify-items:center;padding:22px 18px}
.pic{width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 8px 8px rgba(0,0,0,.18));animation:pop .4s}
.word{font-family:var(--display);font-size:clamp(30px,8vw,44px);font-weight:700;word-break:break-word}
.ipa{color:var(--muted);font-size:18px;font-weight:600}
.say{border:0;background:var(--gold);border-radius:999px;padding:8px 18px 8px 10px;font-weight:800;font-size:18px;display:inline-flex;align-items:center;gap:8px;
  box-shadow:0 4px 0 #c99400;color:#4a3000}
.say img{width:36px;height:36px}
.say.big img{width:70px;height:70px}
.say.big{padding:14px 24px}
.say.slow{background:#c8f5d0;box-shadow:0 4px 0 #6cbf7a;color:#124a1d;padding:8px 16px;font-size:18px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
.opt{background:var(--panel);color:#1a1a1a;border:0;border-radius:var(--radius);padding:16px 12px;font-size:21px;font-weight:800;min-height:66px;
  box-shadow:0 5px 0 rgba(0,0,0,.14);border-bottom:0}
.opt:nth-child(1){background:#fff1a8}.opt:nth-child(2){background:#c9f2ff}.opt:nth-child(3){background:#ffd6e7}.opt:nth-child(4){background:#d4f7c6}
[data-world="mine"] .opt{border:3px solid var(--line);border-radius:4px}
.opt.ok{background:var(--good)!important;color:#fff;animation:pop .35s}
.opt.no{background:var(--bad)!important;color:#fff;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.opt:disabled{cursor:default}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.slot{width:40px;height:50px;border-bottom:5px solid var(--accent);display:grid;place-items:center;font-size:28px;font-weight:800;font-family:var(--display)}
.slot.gap{border:0;width:16px}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{width:52px;height:56px;border:0;border-radius:14px;font-size:28px;font-weight:900;font-family:"Rubik",sans-serif;color:#fff;
  background:var(--tc,#ff7a1a);box-shadow:0 5px 0 rgba(0,0,0,.25);text-shadow:2px 2px 0 rgba(0,0,0,.2)}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
[data-world="mine"] .tile{border-radius:4px;border:3px solid rgba(0,0,0,.5)}
.tile:disabled{opacity:.2}
.feedback{min-height:30px;text-align:center;font-weight:900;font-size:22px;font-family:var(--display)}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
.type{width:100%;font:inherit;font-size:28px;font-weight:800;padding:14px;text-align:center;border-radius:var(--radius);border:4px solid var(--accent);background:#fff;color:var(--ink)}
.hearts{display:flex;gap:2px}.hearts img{width:30px;height:30px}
.dots{display:flex;gap:4px;flex:1}
.dots i{flex:1;height:12px;background:rgba(255,255,255,.6);border-radius:6px}
.dots i.done{background:var(--good)}
.dots i.cur{background:var(--gold)}

/* Compact question card + task line */
.qcard.compact{padding:14px;gap:8px}
.pic.sm{width:84px;height:84px}
.task{font-weight:900;font-size:18px;font-family:var(--display)}
.combo{background:var(--gold);color:#4a3000;font-weight:900;padding:4px 14px;border-radius:999px;animation:wig 1s infinite}


/* Ore wall */
.wall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ore{position:relative;min-height:96px;border:0;display:grid;place-items:center;padding:8px;transition:transform .15s,opacity .3s}
.ore span{position:relative;z-index:1;font-weight:900;font-size:16px;line-height:1.2;padding:4px 8px;border-radius:8px;overflow-wrap:normal;hyphens:manual}
@media (max-width:520px){.wall{grid-template-columns:repeat(2,minmax(0,1fr))}.ore{min-height:78px}}
[data-world="mine"] .ore{border:4px solid #222;box-shadow:inset -5px -5px 0 rgba(0,0,0,.3),inset 5px 5px 0 rgba(255,255,255,.25),0 4px 0 rgba(0,0,0,.3);background:var(--spk),repeating-conic-gradient(#9aa0a6 0 25%,#858b91 0 50%) 0 0/16px 16px}
[data-world="mine"] .ore span{background:rgba(0,0,0,.6);color:#fff}
[data-world="mine"] .ore.v1{--spk:radial-gradient(circle at 18% 22%,#5ff2ff 0 6%,transparent 7%),radial-gradient(circle at 82% 78%,#5ff2ff 0 6%,transparent 7%)}
[data-world="mine"] .ore.v2{--spk:radial-gradient(circle at 20% 75%,#ffd21f 0 6%,transparent 7%),radial-gradient(circle at 80% 20%,#ffd21f 0 6%,transparent 7%)}
[data-world="mine"] .ore.v3{--spk:radial-gradient(circle at 15% 20%,#2fe06a 0 6%,transparent 7%),radial-gradient(circle at 85% 80%,#2fe06a 0 6%,transparent 7%)}
[data-world="mine"] .ore.v4{--spk:radial-gradient(circle at 20% 80%,#ff3b2f 0 6%,transparent 7%),radial-gradient(circle at 80% 18%,#ff3b2f 0 6%,transparent 7%)}
[data-world="mine"] .ore.v5{--spk:radial-gradient(circle at 15% 15%,#3a5cff 0 6%,transparent 7%),radial-gradient(circle at 85% 85%,#3a5cff 0 6%,transparent 7%)}
[data-world="bake"] .ore{border-radius:50% 50% 22px 22px;box-shadow:0 6px 0 rgba(0,0,0,.12);background:radial-gradient(circle at 25% 30%,#fff 0 4%,transparent 5%),radial-gradient(circle at 70% 25%,#ffd21f 0 4%,transparent 5%),radial-gradient(circle at 55% 15%,#3fa9f5 0 4%,transparent 5%),var(--ck)}
[data-world="bake"] .ore span{background:rgba(255,255,255,.88);color:#3a0f28}
[data-world="bake"] .ore.v1{--ck:linear-gradient(#ff9ccc 50%,#f5c16c 50%)}
[data-world="bake"] .ore.v2{--ck:linear-gradient(#8fe3c6 50%,#f5c16c 50%)}
[data-world="bake"] .ore.v3{--ck:linear-gradient(#c9a7ff 50%,#f5c16c 50%)}
[data-world="bake"] .ore.v4{--ck:linear-gradient(#ffe066 50%,#f5c16c 50%)}
[data-world="bake"] .ore.v5{--ck:linear-gradient(#7a3b1d 50%,#f5c16c 50%)}
.ore.crack::after{content:"";position:absolute;inset:0;background:linear-gradient(35deg,transparent 46%,#222 47% 49%,transparent 50%),linear-gradient(-50deg,transparent 46%,#222 47% 49%,transparent 50%)}
[data-world="bake"] .ore.crack::after{background:radial-gradient(circle at 80% 10%,var(--bg-bite,#fff4f6) 0 22%,transparent 23%),radial-gradient(circle at 95% 30%,#fff4f6 0 16%,transparent 17%)}
.ore.broken{transform:scale(1.25);opacity:0}
.ore.stone{animation:shake .35s;filter:grayscale(1) brightness(.8)}
.ore.right{outline:5px solid var(--good);outline-offset:2px}

/* Falling words */
.field{position:relative;height:min(46vh,330px);border-radius:var(--radius);overflow:hidden}
[data-world="mine"] .field{background:linear-gradient(#5e3c1c,#3b2512);border:4px solid #222}
[data-world="bake"] .field{background:linear-gradient(#cdefff,#fff4d6);border:4px solid #fff;box-shadow:0 0 0 4px var(--line)}
.floor{position:absolute;left:0;right:0;bottom:0;height:16px}
[data-world="mine"] .floor{background:repeating-linear-gradient(90deg,#9aa0a6 0 10px,#6b4423 10px 14px)}
[data-world="bake"] .floor{background:#8fe3c6}
.faller{position:absolute;top:-80px;min-height:62px;border:0;padding:6px 4px;font-weight:900;font-size:16px;line-height:1.15;overflow-wrap:normal;
  animation-name:drop;animation-timing-function:linear;animation-fill-mode:forwards;color:#1a1a1a}
@keyframes drop{to{top:calc(100% - 78px)}}
[data-world="mine"] .faller{background:linear-gradient(#ffe9b0 0 70%,#555 70%);border:3px solid #222;border-radius:6px 6px 2px 2px}
[data-world="mine"] .faller::after{content:"";position:absolute;left:12%;right:12%;bottom:-8px;height:10px;background:radial-gradient(circle at 15% 50%,#222 0 40%,transparent 41%),radial-gradient(circle at 85% 50%,#222 0 40%,transparent 41%)}
[data-world="bake"] .faller{background:radial-gradient(circle at 30% 30%,#ff8fb1,#e8174f);color:#fff;border-radius:46% 46% 50% 50%;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.faller.caught{background:var(--good)!important;color:#fff;transform:scale(1.12)}
.faller.no{background:var(--bad)!important;color:#fff}
.faller.right{outline:5px solid var(--good);outline-offset:2px}

/* Maze */
.track{display:flex;align-items:center;gap:4px;padding:8px;border-radius:var(--radius);overflow-x:auto}
[data-world="mine"] .track{background:#5e3c1c;border:4px solid #222}
[data-world="bake"] .track{background:#fff;box-shadow:0 0 0 4px var(--line)}
.step{flex:1 0 26px;height:34px;border-radius:6px;display:grid;place-items:center;background:rgba(255,255,255,.18)}
[data-world="bake"] .step{background:#ffe3ef}
.step.done{background:var(--good)}
.step.here{background:var(--gold)}
.step img{width:32px;height:32px;animation:pop .4s}
.goal img{width:40px;height:40px}
.doors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.door{position:relative;border:0;aspect-ratio:3/4;display:grid;place-items:center;padding:14px 10px 30px;transition:transform .2s}
.door img,.door .noimg{width:80%;height:auto;max-height:70%;object-fit:contain}
[data-world="mine"] .door{background:radial-gradient(ellipse at 50% 100%,#1b1b1b 0 55%,transparent 56%),repeating-conic-gradient(#9aa0a6 0 25%,#858b91 0 50%) 0 0/14px 14px;border:4px solid #222;border-radius:50% 50% 4px 4px}
[data-world="bake"] .door{background:radial-gradient(circle,#fff 0 58%,#ffc2dc 59% 64%,#fff 65%);border-radius:24px;box-shadow:0 6px 0 rgba(0,0,0,.1)}
.door .lbl{position:absolute;left:4px;right:4px;bottom:6px;background:#fff;color:#1a1a1a;font-weight:900;font-size:14px;border-radius:8px;padding:2px}
.door.open{outline:6px solid var(--good);outline-offset:2px;transform:scale(1.05)}
.door.dead{filter:grayscale(1);animation:shake .35s}

/* Memory */
.memo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:420px){.memo{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mcard{position:relative;aspect-ratio:1;border:0;padding:0;background:none;perspective:600px}
.mcard .back,.mcard .front{position:absolute;inset:0;display:grid;place-items:center;border-radius:12px;backface-visibility:hidden;transition:transform .35s}
.mcard .front{transform:rotateY(180deg);background:#fff;padding:6px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.mcard .front img,.mcard .front .noimg{width:80%;height:80%;object-fit:contain}
.mcard .front b{font-size:15px;line-height:1.1;word-break:break-word;color:#1a1a1a}
.mcard.up .back{transform:rotateY(180deg)} .mcard.up .front{transform:rotateY(360deg)}
[data-world="mine"] .mcard .back{background:linear-gradient(#ffd21f 0 12%,transparent 12% 88%,#ffd21f 88%),repeating-linear-gradient(0deg,#b8783a 0 10px,#9c6430 10px 12px);border:3px solid #3b2a1a}
[data-world="mine"] .mcard .back::after{content:"";width:22%;height:22%;background:#ffd21f;border:3px solid #3b2a1a}
[data-world="bake"] .mcard .back{background:radial-gradient(circle at 30% 30%,#fff 0 6%,transparent 7%),radial-gradient(circle at 70% 60%,#ffd21f 0 6%,transparent 7%),linear-gradient(135deg,#ff8fc0,#c9a7ff);border:3px solid #fff}
.mcard.match .front{box-shadow:0 0 0 4px var(--good)}

/* Summary */
.sum{text-align:center;display:grid;gap:14px;justify-items:center;padding:28px 18px}
.sum .bigimg{width:140px;height:140px;animation:pop .6s}
.newlist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.newlist span{background:#fff4c2;padding:6px 12px 6px 6px;border-radius:999px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.newlist img{width:30px;height:30px}

/* Burst */
.burst{position:fixed;width:40px;height:40px;pointer-events:none;z-index:50;animation:fly .9s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--r));opacity:0}}

/* Parent report */
details.report summary{cursor:pointer;font-weight:800;font-family:var(--display);font-size:19px;list-style:none}
details.report summary::-webkit-details-marker{display:none}
.tbl-wrap{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #e3e3e3;vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td img{width:28px;height:28px}
.st{font-weight:800;font-size:13px;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st.l{background:#d3f7de;color:#13803a} .st.p{background:#fff0bf;color:#8a6300} .st.n{background:#eceff4;color:#5d6b85}
.steps{display:flex;gap:4px}
.steps i{width:11px;height:11px;border-radius:3px;background:#dfe4ec} .steps i.on{background:#22b04b}

@media (prefers-reduced-motion:reduce){*:not(.faller){animation:none!important;transition:none!important}}

/* ===== НАСТРОЙКИ ПРОДАЖИ =====
   API_URL — ссылка веб-приложения Google Apps Script (заканчивается на /exec). Пусто = игра без кодов, прогресс только на этом устройстве.
   CONTACT — куда писать родителям для оплаты и продления. */
const API_URL='https://script.google.com/macros/s/AKfycbwj7v-7yBqmpD6YxNrWmc_58nB2UFWu-wYxpv2JICSXnX8PG3ymutq3CqJrDt7JX_rE/exec';
const CONTACT='Напишите автору игры';
const KEY='wordquest-spotlight4-unit4';
let ACC=null;
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};
const DEV=(()=>{let d=lsGet('wq-device');if(!d){d='d'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);lsSet('wq-device',d)}return d})();
const storeKey=()=>ACC?KEY+'-'+ACC.code:KEY;
const W0=()=>({seen:0,c:0,s:0,t:0,ok:0,bad:0,last:0});
function blank(){return {world:null,coins:0,progress:{},custom:[],unit:'u4',words:{},streak:{n:0,day:''},rounds:0,shop:{pin:'',rewards:null,coupons:[],history:[]}}}
let S=blank();
function loadState(p){S=blank();if(!p)return;S=Object.assign(blank(),p);if(!S.shop||typeof S.shop!=='object')S.shop=blank().shop;['coupons','history'].forEach(k=>{if(!Array.isArray(S.shop[k]))S.shop[k]=[]});
  if(p.words&&!(p.progress&&p.progress.u4))S.progress.u4=p.words;if(!Array.isArray(S.custom))S.custom=[];if(!S.streak)S.streak={n:0,day:''}}
function localState(){try{const raw=lsGet(storeKey());return raw?JSON.parse(raw):null}catch(e){return null}}
if(!API_URL)loadState(localState());
const allUnits=()=>UNITS.concat(S.custom);
function useUnit(id){const u=allUnits().find(x=>x.id===id)||UNITS[0];S.unit=u.id;WORDS=u.words;N=WORDS.length;
  const pr=S.progress[u.id]=S.progress[u.id]||{};WORDS.forEach(x=>{if(!pr[x.en])pr[x.en]=W0()});S.words=pr}
useUnit(S.unit);
const curUnit=()=>allUnits().find(x=>x.id===S.unit)||UNITS[0];
function snapshot(){const o=Object.assign({},S);delete o.words;return JSON.stringify(o)}
function save(){lsSet(storeKey(),snapshot());if(API_URL&&ACC)remoteSave(false)}
let saveT=null;
function remoteSave(now){clearTimeout(saveT);saveT=setTimeout(pushSave,now?0:2500)}
function pushSave(){if(!API_URL||!ACC)return;
  try{fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},keepalive:true,
    body:JSON.stringify({code:ACC.code,device:DEV,progress:snapshot()})}).then(r=>r.json()).then(r=>{
      if(r&&!r.ok&&(r.error==='expired'||r.error==='blocked'||r.error==='device')){gate(r,ACC.code)}}).catch(()=>{})}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&ACC){clearTimeout(saveT);pushSave()}});

const fmtDate=u=>u?u.split('-').reverse().join('.'):'';
function loginScreen(msg,code){
  document.documentElement.setAttribute('data-world','');
  app.innerHTML=`<div class="start-head"><h1>Word Quest</h1><p>Учим английские слова по учебнику Spotlight 4 — юнит за юнитом</p></div>
   <form class="panel gate" id="lf">
     <h2>Введи свой код</h2>
     <p class="muted">Код вы получаете после оплаты. С ним можно играть на телефоне, планшете и компьютере — прогресс везде один.</p>
     <input class="type" id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC-2345" value="${esc(code||'')}" aria-label="Код доступа">
     ${msg?`<div class="gate-msg">${msg}</div>`:''}
     <button class="btn wide" type="submit">Войти</button>
   </form>`;
  $('#lf').onsubmit=e=>{e.preventDefault();const c=$('#code').value.trim().toUpperCase();if(c)doLogin(c)};
}
function gate(r,code){
  const m={notfound:'Такого кода нет. Проверь, правильно ли он введён: буквы латинские, например ABC-2345.',
    expired:`Доступ закончился${r.until?' '+fmtDate(r.until):''}. Прогресс сохранён: попроси родителей продлить доступ — и продолжай строить!<br><b>${esc(CONTACT)}</b>`,
    blocked:`Этот код отключён.<br><b>${esc(CONTACT)}</b>`,
    devices:`Этот код уже используется на ${r.max||3} устройствах. Чтобы играть здесь, попроси родителей написать автору игры.<br><b>${esc(CONTACT)}</b>`,
    device:`Это устройство не привязано к коду. Войди заново.`,
    network:'Нет связи с сервером. Проверь интернет и попробуй ещё раз.',
    server:'Сервер не ответил. Попробуй ещё раз через минуту.'}[r.error]||'Не получилось войти. Попробуй ещё раз.';
  ACC=null;loginScreen(m,code);
}
async function doLogin(code,auto){
  app.innerHTML='<div class="panel gate"><h2>Загружаем твой дом…</h2></div>';
  let r;
  try{r=await (await fetch(API_URL+'?action=login&code='+encodeURIComponent(code)+'&device='+encodeURIComponent(DEV))).json()}
  catch(e){ // нет сети: играем с копией на устройстве, сохраним позже
    if(auto){ACC={code,name:lsGet('wq-name')||'',until:lsGet('wq-until')||'',daysLeft:99,offline:true};const st=localState();if(st){loadState(st);useUnit(S.unit);return render()}}
    return gate({error:'network'},code)}
  if(!r||!r.ok){if(r&&r.error!=='network')lsDel('wq-code');return gate(r||{error:'server'},code)}
  ACC={code:r.code||code,name:r.name||'',until:r.until,daysLeft:r.daysLeft,plan:r.plan};
  lsSet('wq-code',ACC.code);lsSet('wq-name',ACC.name);lsSet('wq-until',ACC.until||'');
  let st=null;if(r.progress){try{st=JSON.parse(r.progress)}catch(e){}}
  const local=localState();
  if(!st)st=local;
  loadState(st);useUnit(S.unit);
  if(!r.progress)remoteSave(true);
  render();
}
function logout(){clearTimeout(saveT);pushSave();lsDel('wq-code');ACC=null;loadState(null);useUnit('u4');loginScreen('')}

const learnedCount=()=>WORDS.filter(x=>learned(x.en)).length;
const th=()=>T[S.world];
const rank=()=>{const r=th().ranks;return r[Math.min(r.length-1,Math.floor(learnedCount()/N*(r.length-1)+0.0001))]};
function dayStr(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function bumpStreak(){const t=dayStr(new Date());if(S.streak.day===t)return;const y=new Date();y.setDate(y.getDate()-1);
  S.streak.n=S.streak.day===dayStr(y)?S.streak.n+1:1;S.streak.day=t}

let curAudio=null;
function playClip(t,slow){const a=AUDIO[t]||AUDIO[String(t).toLowerCase()];if(!a)return false;
  try{if('speechSynthesis' in window)speechSynthesis.cancel();if(curAudio){curAudio.pause()}
    curAudio=new Audio(slow?a.s:a.n);
    const pr=curAudio.play();if(pr&&pr.catch)pr.catch(()=>{});return true}catch(e){return false}}
function speak(t,slow){if(playClip(t,slow))return;try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();
  const parts=slow?t.split(' '):[t];
  setTimeout(()=>parts.forEach(w=>{const u=new SpeechSynthesisUtterance(w);u.lang=voice?voice.lang:'en-AU';if(voice)u.voice=voice;
    u.rate=slow?0.35:0.55;u.pitch=1.05;u.volume=1;speechSynthesis.speak(u)}),120)}catch(e){}}
function fillVoices(sel){sel.innerHTML=voices.length?voices.map(v=>`<option value="${esc(v.name)}" ${voice&&v.name===voice.name?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join(''):'<option>Голоса не найдены</option>'}
let ac=null;
function beep(ok){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const n=ac.currentTime;
  const notes=ok?[523,659,784]:[262,196];notes.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();
  o.type=S.world==='mine'?'square':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,n+i*.08);g.gain.exponentialRampToValueAtTime(.1,n+i*.08+.01);
  g.gain.exponentialRampToValueAtTime(.0001,n+i*.08+.18);o.connect(g);g.connect(ac.destination);o.start(n+i*.08);o.stop(n+i*.08+.2)})}catch(e){}}

const $=s=>document.querySelector(s);
const app=$('#app');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().replace(/[’']/g,'').replace(/\s+/g,' ').trim();
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)):j}return m[a.length][b.length]}

function suggested(){
  if(WORDS.some(x=>!S.words[x.en].seen))return 'learn';
  if(WORDS.some(x=>S.words[x.en].c<1))return 'en2ru';
  if(WORDS.some(x=>S.words[x.en].c<2))return 'ru2en';
  if(WORDS.some(x=>S.words[x.en].s<1))return 'spell';
  return 'boss'}
function burst(el,n=8){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const r=(el||app).getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  for(let i=0;i<n;i++){const b=document.createElement('img');b.src=IMG[th().coin];b.className='burst';
    const a=Math.PI*2*i/n+Math.random()*.4,d=90+Math.random()*60;
    b.style.left=(cx-20)+'px';b.style.top=(cy-20)+'px';b.style.setProperty('--dx',Math.cos(a)*d+'px');b.style.setProperty('--dy',Math.sin(a)*d-40+'px');b.style.setProperty('--r',(Math.random()*120-60)+'deg');
    document.body.appendChild(b);setTimeout(()=>b.remove(),950)}}

function scene(){
  const t=th();
  if(S.world==='mine')return `<div class="scene"><div class="grass"></div><div class="dirt"></div><span class="title">${TAG}</span>${hud()}
    ${im('sun','float','')}${im('cloud','','')}${im('tree','','')}${im('tree','','')}${im('house','','')}${im('rock','','')}</div>`;
  return `<div class="scene"><span class="title">${TAG}</span>${hud()}
    ${im('unicorn','float','')}${im('c4','','')}${im('c0','','')}${im('sparkles','float','')}${im('c18','','')}</div>`;
}
const TAG='Учим английские слова по учебнику Spotlight 4 — юнит за юнитом';
function hud(){const t=th();return `<span class="hud">${ACC&&ACC.name?`<span class="chip name">${esc(ACC.name)}</span>`:''}<span class="chip" title="${t.coinName}">${im(t.coin)} ${S.coins}</span><span class="chip" title="дней подряд">${im('fire')} ${S.streak.n}</span><span class="chip" title="звание">${im(S.world==='mine'?'trophy':'crown')} ${rank()}</span></span>`}
function placeScene(){
  const P=S.world==='mine'
   ?['left:52%;top:3px;width:28px','left:40%;top:6px;width:34px;opacity:.85','left:46%;bottom:14px;width:22px','display:none','display:none','display:none']
   :['display:none','display:none','left:46%;bottom:10px;width:28px','left:40%;top:6px;width:22px','display:none'];
  app.querySelectorAll('.scene > img').forEach((x,i)=>x.style.cssText=P[i]||'display:none');
}

function unitDone(u){const pr=S.progress[u.id]||{};return u.words.filter(x=>{const w=pr[x.en];return w&&Math.min(w.c,2)+Math.min(w.s,1)+Math.min(w.t,1)>=4}).length}
function board(){
  const units=allUnits(),map={};let bi=0;
  units.forEach((u,i)=>{const P=PARTS[i];if(!P)return;const lit=Math.round(unitDone(u)/u.words.length*20),cur=u.id===S.unit;
    P.cells.forEach((c,j)=>{map[c[0]+','+c[1]]={t:c[2],on:j<lit,cur,ghost:cur&&j>=lit,j}})});
  const keys=Object.keys(map).map(k=>k.split(',').map(Number));
  let x0=Math.min(...keys.map(c=>c[0]))-1,x1=Math.max(...keys.map(c=>c[0]))+1,y0=Math.min(...keys.map(c=>c[1]))-1,y1=Math.max(9,...keys.map(c=>c[1]));
  x0=Math.max(0,x0);x1=Math.min(12,x1);y0=Math.max(0,y0);
  const cols=x1-x0+1;let h='';
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const c=map[x+','+y];
    if(!c){h+=`<div class="cell ${y===9?'ground':y>9?'under':''}"></div>`;continue}
    let inner='';if(c.on&&S.world==='bake'&&BAKE_IMG[c.t]){const a=BAKE_IMG[c.t];inner=im(a[(x+y)%a.length])}
    h+=`<div class="cell ${c.t} ${c.on?'on':''} ${c.ghost?'ghost':''} ${c.cur?'cur':''}">${inner}</div>`}
  const parts=units.map((u,i)=>{const P=PARTS[i];if(!P)return '';const d=unitDone(u),n=u.words.length;
    const cls=d>=n?'done':u.id===S.unit?'cur':'locked';
    return `<div class="part ${cls}"><span class="dot"></span>${esc(u.title)} → ${esc(P[S.world])}<i>${d}/${n}</i></div>`}).join('');
  const nextP=PARTS[units.length];
  return `<div class="board-body"><div class="estate" aria-label="Дом" style="grid-template-columns:repeat(${cols},1fr);width:min(100%,${cols*30}px)">${h}</div><div class="parts">${parts}${nextP?`<div class="part locked"><span class="dot"></span>Следующий юнит → ${esc(nextP[S.world])} 🔒</div>`:''}</div></div>`
}

function hub(){
  const t=th(),k=learnedCount(),sug=suggested();
  app.innerHTML=`
  ${scene()}
  ${ACC&&ACC.until&&ACC.daysLeft<=5?`<div class="warn">⏰ Доступ оплачен до ${fmtDate(ACC.until)}${ACC.daysLeft<=0?' (последний день)':` (осталось ${ACC.daysLeft} дн.)`}. Попроси родителей продлить, чтобы не потерять доступ к дому.</div>`:''}
  <div class="units" role="tablist">
    ${allUnits().map(u=>{const done=unitDone(u);
      return `<button class="unit ${u.id===S.unit?'cur':''}" data-u="${esc(u.id)}" role="tab" aria-selected="${u.id===S.unit}"><b>${esc(u.title)}</b><small>${esc(u.name)}</small><i>${done}/${u.words.length}</i></button>`}).join('')}
    <button class="unit add" id="addu"><b>+ Юнит</b></button>
  </div>
  <div class="panel" id="addbox" hidden style="display:grid;gap:10px">
    <h3>Новый юнит</h3>
    <div class="row"><input class="type small" id="nu-title" placeholder="Unit 5" aria-label="Номер юнита"><input class="type small" id="nu-name" placeholder="Название (необязательно)" aria-label="Название юнита"></div>
    <textarea class="type small" id="nu-words" rows="8" aria-label="Слова" placeholder="Каждое слово с новой строки:&#10;cat - кошка&#10;dog - собака&#10;red - красный&#10;green - зелёный"></textarea>
    <p class="muted" style="font-size:14px">Пишите: английское слово, тире, перевод. Можно добавить третью часть — как читается: <b>cat - кошка - кэт</b>. Нужно минимум 4 слова.</p>
    <p class="feedback no" id="nu-err"></p>
    <div class="row"><button class="btn" id="nu-save">Сохранить юнит</button><button class="btn ghost" id="nu-cancel">Отмена</button></div>
  </div>
  <div class="panel board-wrap">
    <div class="row"><h3>${t.board}</h3><span class="muted" style="font-weight:800;font-size:15px">${esc(curUnit().title)}</span><span class="spacer"></span><h3>${k} / ${N}</h3></div>
    <div class="bar"><i style="width:${k/N*100}%"></i></div>
    <p class="muted" style="font-size:15px;font-weight:600">${t.boardSub}</p>
    ${board()}
    ${k===N?`<p style="text-align:center;font-weight:900;font-size:20px">${t.done}</p>`:''}
  </div>
  <div class="missions">
    ${ORDER.map(id=>{const m=t.m[id];return `<button class="mission" data-m="${id}" style="--mc:${m[3]};--mc2:${m[4]};--ms:${m[5]}">
      ${id===sug?'<span class="badge">Играй тут!</span>':''}${im(m[0])}<span><b>${m[1]}</b><small>${m[2]}</small></span></button>`}).join('')}
  </div>
  ${shop()}
  ${report()}
    <div class="row"><button class="btn ghost" id="sw">Сменить мир</button>${ACC?'<button class="btn ghost" id="lo">Выйти</button>':''}<span class="spacer"></span><button class="btn ghost" id="rs">Начать заново</button></div>
  <div class="panel" id="rsbox" hidden><p><b>Начать игру с нуля?</b> Сотрутся все выученные слова во всех юнитах, дом, ${th().coinName}, серия дней и купоны. Список наград и PIN родителя останутся. Это нельзя отменить.</p>${S.unit.startsWith('my')?'<p class="muted" style="font-size:14px;margin-top:6px">Этот юнит добавлен вручную — его можно удалить целиком.</p>':''}<div class="row" style="margin-top:10px"><button class="btn" id="rsyes">Да, стереть</button><button class="btn ghost" id="rsno">Отмена</button></div></div>`;
  placeScene();
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>play(b.dataset.m));
  $('#sw').onclick=()=>setWorld(null);
  const lo=$('#lo');if(lo)lo.onclick=logout;
  $('#rs').onclick=()=>{$('#rsbox').hidden=false};
  $('#rsno').onclick=()=>{$('#rsbox').hidden=true};
  $('#rsyes').onclick=()=>{const keep={world:S.world,custom:S.custom,shop:{pin:S.shop.pin,rewards:S.shop.rewards,coupons:[],history:[]}};const u=S.unit;loadState(Object.assign(blank(),keep));useUnit(allUnits().some(x=>x.id===u)?u:'u4');save();render()};
  if(S.unit.startsWith('my')){const d=document.createElement('button');d.className='btn ghost';d.textContent='Удалить юнит';$('#rsno').after(d);
    d.onclick=()=>{S.custom=S.custom.filter(u=>u.id!==S.unit);delete S.progress[S.unit];useUnit('u4');save();render()}}
  app.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{useUnit(b.dataset.u);save();render()});
  $('#addu').onclick=()=>{const b=$('#addbox');b.hidden=!b.hidden;if(!b.hidden)$('#nu-title').focus()};
  $('#nu-cancel').onclick=()=>{$('#addbox').hidden=true};
  $('#nu-save').onclick=()=>{
    const title=$('#nu-title').value.trim()||('Unit '+(allUnits().length+1));const name=$('#nu-name').value.trim()||'Мои слова';
    const seen=new Set(),words=[];
    $('#nu-words').value.split(/\n/).forEach(line=>{const parts=line.split(/\s+-\s+|\s*[—–=\t]\s*/).map(x=>x.trim()).filter(Boolean);
      if(parts.length<2)return;const en=parts[0].replace(/\s+/g,' ');if(!/[a-z]/i.test(en)||seen.has(en.toLowerCase()))return;seen.add(en.toLowerCase());
      words.push({en,ru:parts[1],rd:parts[2]||''})});
    if(words.length<4){$('#nu-err').textContent='Нужно хотя бы 4 слова в формате: cat - кошка';return}
    const id='my'+Date.now();S.custom.push({id,title,name,words});useUnit(id);save();render()};
  $('#copy').onclick=copyReport;
  $('#rep').ontoggle=e=>{REP_OPEN=e.target.open};
  bindShop();bindParent();
}

/* ---------- Награды: ребёнок копит монетки и обменивает на награды от родителей ---------- */
let REP_OPEN=false,PARENT_OK=false,GIVE=null,SHOP_EDIT=false;
const REWARD_ICONS=['r_game','r_tv','c7','r_popcorn','r_scooter','r_bike','r_ball','r_pizza','r_bear','r_ticket','r_ferris','r_bag','c4','party'];
const DEFAULT_REWARDS=[
 {id:'g',name:'30 минут любимой игры',icon:'r_game',price:50},
 {id:'t',name:'Мультик или серия',icon:'r_tv',price:40},
 {id:'s',name:'Вкусняшка',icon:'c7',price:40},
 {id:'w',name:'Прогулка на площадку',icon:'r_scooter',price:60},
 {id:'p',name:'Выбираю, что будет на ужин',icon:'r_pizza',price:80},
 {id:'b',name:'Маленький подарок',icon:'r_bear',price:200},
 {id:'k',name:'Кино или парк развлечений',icon:'r_ticket',price:300}];
const rewards=()=>S.shop.rewards||DEFAULT_REWARDS;
function shop(){
  const t=th(),mine=S.world==='mine',wait=S.shop.coupons.filter(c=>c.status==='wait');
  return `<div class="panel shop" id="shop">
   <div class="row"><h3>${mine?'Сундук наград':'Витрина подарков'}</h3>${SHOP_EDIT?'':'<button class="btn ghost edit-top" id="shopedit2">✏️ Изменить награды</button>'}<span class="spacer"></span><span class="chip">${im(t.coin)} ${S.coins}</span></div>
   <p class="muted" style="font-weight:700;font-size:15px">Копи ${t.coinName} за слова и обменивай на награды. Купон покажи родителям — они подтвердят.</p>
   <div class="rewards">${rewards().map(r=>{const lack=r.price-S.coins;return `<div class="reward ${lack>0?'lack':''}">${im(r.icon)}<b>${esc(r.name)}</b>
     <button class="buy" data-r="${esc(r.id)}" ${lack>0?'disabled':''}>${im(t.coin)} ${r.price}</button>${lack>0?`<small>ещё ${lack}</small>`:'<small class="can">можно купить!</small>'}</div>`}).join('')}</div>
   ${wait.length?`<h3 style="margin-top:14px">Мои купоны</h3><div class="coupons">${wait.map(c=>`<div class="coupon">${im(c.icon)}<span><b>${esc(c.name)}</b><small>Покажи родителям</small></span><button class="btn ghost" data-give="${c.id}">Выдать</button></div>`).join('')}</div>`:''}
   <div id="pinbox"></div>
   ${SHOP_EDIT?parentZone():'<button class="btn ghost wide" id="shopedit" style="margin-top:12px">✏️ Родителям: изменить награды или вписать свою</button>'}
  </div>`}
function bindShop(){
  app.querySelectorAll('.buy').forEach(b=>b.onclick=()=>{
    const r=rewards().find(x=>x.id===b.dataset.r);if(!r||S.coins<r.price)return;
    if(!b.classList.contains('sure')){app.querySelectorAll('.buy.sure').forEach(x=>{x.classList.remove('sure');x.innerHTML=x.dataset.html});
      b.dataset.html=b.innerHTML;b.classList.add('sure');b.textContent='Точно купить?';return}
    S.coins-=r.price;S.shop.coupons.push({id:'c'+Date.now(),name:r.name,icon:r.icon,price:r.price,at:Date.now(),status:'wait'});
    beep(true);save();render();setTimeout(()=>{const sh=$('#shop');if(sh){sh.scrollIntoView({block:'center'});burst(sh,10)}},80)});
  app.querySelectorAll('[data-give]').forEach(b=>b.onclick=()=>{GIVE=b.dataset.give;drawPin()});
  ['#shopedit','#shopedit2'].forEach(id=>{const se=$(id);if(se)se.onclick=()=>{SHOP_EDIT=true;render();toShop()}});
}
function drawPin(){
  const box=$('#pinbox');if(!box)return;const c=S.shop.coupons.find(x=>x.id===GIVE);if(!c){box.innerHTML='';return}
  if(!S.shop.pin){box.innerHTML=`<div class="pinbox"><p><b>Для родителей:</b> сначала нажмите «Родителям: изменить награды» ниже и придумайте PIN.</p><button class="btn ghost" id="pinx">Закрыть</button></div>`;
    $('#pinx').onclick=()=>{GIVE=null;box.innerHTML=''};return}
  box.innerHTML=`<form class="pinbox" id="pinf"><p><b>Для родителей.</b> Выдать «${esc(c.name)}»? Введите PIN.</p>
    <input class="type small" id="pin" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="PIN" aria-label="PIN родителя">
    <p class="feedback no" id="pinerr"></p>
    <div class="row"><button class="btn" type="submit">Выдать награду</button><button class="btn ghost" type="button" id="refund">Отменить и вернуть ${c.price}</button><button class="btn ghost" type="button" id="pinx">Закрыть</button></div></form>`;
  $('#pin').focus();
  const ok=()=>$('#pin').value.trim()===S.shop.pin;
  $('#pinf').onsubmit=e=>{e.preventDefault();if(!ok()){$('#pinerr').textContent='Неверный PIN';return}
    c.status='done';c.doneAt=Date.now();S.shop.history.unshift(c);S.shop.history=S.shop.history.slice(0,30);S.shop.coupons=S.shop.coupons.filter(x=>x.status==='wait');
    GIVE=null;beep(true);save();render();setTimeout(()=>{const sh=$('#shop');if(sh){sh.scrollIntoView({block:'center'});burst(sh,14)}},80)};
  $('#refund').onclick=()=>{if(!ok()){$('#pinerr').textContent='Чтобы отменить, тоже нужен PIN';return}
    S.coins+=c.price;S.shop.coupons=S.shop.coupons.filter(x=>x.id!==c.id);GIVE=null;save();render()};
  $('#pinx').onclick=()=>{GIVE=null;box.innerHTML=''};
}
function parentZone(){
  const t=th();
  if(!S.shop.pin)return `<div class="pz"><h3>Для родителей</h3><p class="muted" style="font-size:14px">Придумайте PIN из 4 цифр. Он нужен, чтобы выдавать награды и менять их список. Ребёнку его не говорите.</p>
    <div class="row"><input class="type small" id="newpin" inputmode="numeric" maxlength="6" placeholder="Например 2580" aria-label="Новый PIN"><button class="btn" id="setpin">Сохранить PIN</button><button class="btn ghost" id="pzlock">Отмена</button></div><p class="feedback no" id="pzerr"></p></div>`;
  if(!PARENT_OK)return `<div class="pz"><h3>Для родителей: введите PIN</h3><div class="row"><input class="type small" id="pzpin" inputmode="numeric" maxlength="6" placeholder="PIN" aria-label="PIN родителя"><button class="btn" id="pzopen">Открыть</button><button class="btn ghost" id="pzlock">Отмена</button></div><p class="feedback no" id="pzerr"></p></div>`;
  const hist=S.shop.history.slice(0,8);
  return `<div class="pz"><h3>Изменить награды</h3>
   <p class="muted" style="font-size:14px">Впишите любую свою награду и цену. Нажмите на картинку, чтобы выбрать другую. Ориентир: за хороший день занятий ребёнок получает примерно 15–30 ${t.coinName}. Цена 40–60 — награда раз в 2–3 дня, 200–300 — большая цель на 2–3 недели.</p>
   <div class="redit">${rewards().map((r,i)=>`<div class="rrow" data-i="${i}"><button class="iconpick" type="button" data-i="${i}" aria-label="Сменить картинку">${im(r.icon)}</button>
     <input class="type small rname" value="${esc(r.name)}" placeholder="Своя награда, например: бассейн" aria-label="Название награды"><input class="type small rprice" type="number" min="1" value="${r.price}" aria-label="Цена"><button class="btn ghost rdel" type="button" data-i="${i}" aria-label="Удалить">✕</button></div>`).join('')}</div>
   <div class="row"><button class="btn ghost" id="radd">+ Добавить награду</button><button class="btn" id="rsave">Сохранить награды</button><span class="muted" id="rmsg"></span></div>
   <div class="row" style="margin-top:6px"><button class="btn ghost" id="rdef">Вернуть стандартный список</button><button class="btn ghost" id="pinch">Сменить PIN</button><button class="btn ghost" id="pzlock">Готово, закрыть</button></div>
   ${hist.length?`<p style="margin-top:8px"><b>Выданные награды:</b></p><ul class="hist">${hist.map(h=>`<li>${new Date(h.doneAt).toLocaleDateString('ru-RU')} — ${esc(h.name)} (${h.price})</li>`).join('')}</ul>`:''}
  </div>`}
function readRewards(){return [...app.querySelectorAll('.rrow')].map((row,i)=>{const old=rewards()[+row.dataset.i]||{};
  return {id:old.id||('r'+Date.now()+i),icon:row.dataset.icon||old.icon||'party',name:row.querySelector('.rname').value.trim()||'Награда',price:Math.max(1,Math.round(+row.querySelector('.rprice').value||1))}})}
function toShop(end){setTimeout(()=>{const z=end?$('.redit .rrow:last-child .rname'):$('#shop .pz')||$('#shop');if(z){z.scrollIntoView({block:'center'});if(end){z.focus();z.select()}}},50)}
function bindParent(){
  const sp=$('#setpin');if(sp)sp.onclick=()=>{const v=$('#newpin').value.trim();if(!/^\d{4,6}$/.test(v)){$('#pzerr').textContent='PIN — от 4 до 6 цифр';return}S.shop.pin=v;PARENT_OK=true;save();render();toShop()};
  const po=$('#pzopen');if(po)po.onclick=()=>{if($('#pzpin').value.trim()===S.shop.pin){PARENT_OK=true;render();toShop()}else $('#pzerr').textContent='Неверный PIN'};
  const pl=$('#pzlock');if(pl)pl.onclick=()=>{PARENT_OK=false;SHOP_EDIT=false;render();toShop()};
  if(!PARENT_OK||!S.shop.pin)return;
  app.querySelectorAll('.iconpick').forEach(b=>b.onclick=()=>{const row=b.closest('.rrow');const cur=row.dataset.icon||rewards()[+row.dataset.i]?.icon||'party';
    const nx=REWARD_ICONS[(REWARD_ICONS.indexOf(cur)+1)%REWARD_ICONS.length];row.dataset.icon=nx;b.innerHTML=im(nx)});
  app.querySelectorAll('.rdel').forEach(b=>b.onclick=()=>{b.closest('.rrow').remove()});
  $('#radd').onclick=()=>{S.shop.rewards=readRewards().concat([{id:'r'+Date.now(),name:'',icon:'party',price:50}]);save();render();toShop(true)};
  $('#rsave').onclick=()=>{S.shop.rewards=readRewards();save();render();toShop();const m=$('#rmsg');if(m)m.textContent='Сохранено'};
  $('#rdef').onclick=()=>{S.shop.rewards=null;save();render();toShop()};
  $('#pinch').onclick=()=>{S.shop.pin='';save();render();toShop()};
}

function status(en){const w=S.words[en];if(learned(en))return['l','Выучено'];if(w.seen||w.ok||w.bad)return['p','Учит'];return['n','Не начато']}
function report(){
  const k=learnedCount(),inprog=WORDS.filter(x=>status(x.en)[0]==='p').length;
  const weak=WORDS.filter(x=>S.words[x.en].bad>=2&&!learned(x.en)).map(x=>x.en);
  return `<details class="report panel" id="rep" ${REP_OPEN?'open':''}><summary>Отчёт для родителей ▾</summary>
   <div style="display:grid;gap:10px;margin-top:12px">
    ${ACC?`<p>Код: <b>${esc(ACC.code)}</b>${ACC.until?` · доступ оплачен до <b>${fmtDate(ACC.until)}</b>`:''}</p>`:''}<p><b>Выучено ${k} из ${N}</b> · в процессе ${inprog} · игр сыграно ${S.rounds}</p>
    <p class="muted" style="font-size:14px">Слово считается выученным, когда ребёнок 2 раза узнал его, 1 раз собрал по буквам и 1 раз написал сам по русскому слову, как спрашивают на уроке. Ошибка снимает один шаг.</p>
    ${weak.length?`<p>Трудные слова: <b>${weak.map(esc).join(', ')}</b></p>`:''}
    <div class="tbl-wrap"><table><thead><tr><th></th><th>Слово</th><th>Перевод</th><th>Шаги</th><th>Статус</th><th>Ошибки</th></tr></thead><tbody>
    ${WORDS.map(x=>{const s=status(x.en),sc=score(x.en);return `<tr><td>${im(x.en)}</td><td><b>${esc(x.en)}</b><br><span class="muted" style="font-size:13px">${esc(x.rd||'')}</span></td><td>${esc(x.ru)}</td>
      <td><span class="steps">${[0,1,2,3].map(i=>`<i class="${i<sc?'on':''}"></i>`).join('')}</span></td>
      <td><span class="st ${s[0]}">${s[1]}</span></td><td>${S.words[x.en].bad}</td></tr>`}).join('')}
    </tbody></table></div>
    <div class="row"><button class="btn ghost" id="copy">Скопировать отчёт</button><span id="copied" class="muted"></span></div>
    <p class="muted" style="font-size:12px">Озвучка слов: голос Alba (Piper TTS), запись — University of Edinburgh, лицензия CC BY 4.0.</p>
   </div></details>`}
function copyReport(){
  const txt=`${curUnit().title} «${curUnit().name}»: выучено ${learnedCount()} из ${N}\n`+WORDS.map(x=>`${status(x.en)[1]} — ${x.en} (${x.ru}), ошибок: ${S.words[x.en].bad}`).join('\n');
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.className='type';ta.style.fontSize='14px';ta.rows=8;$('#copy').parentNode.after(ta);ta.select();$('#copied').textContent='Выдели и скопируй текст ниже'};
  try{navigator.clipboard.writeText(txt).then(()=>{$('#copied').textContent='Скопировано'},fallback)}catch(e){fallback()}
}

/* ---------- game engine ---------- */
let G=null;
function play(mode){
  bumpStreak();
  let list;
  if(mode==='learn'){list=WORDS.slice()}
  else list=pickWords(mode==='boss'?10:mode==='memory'?Math.min(6,N):8);
  G={mode,queue:mode==='memory'?[{list}]:list.map(w=>({w,retry:false})),i:0,right:0,coins:0,hearts:3,before:new Set(WORDS.filter(x=>learned(x.en)).map(x=>x.en)),locked:false};
  window.scrollTo(0,0);next();
}
function header(){
  const dots=G.queue.map((_,i)=>`<i class="${i<G.i?'done':i===G.i?'cur':''}"></i>`).join('');
  return `<div class="gtop"><button class="btn ghost" id="quit" aria-label="Выйти">✕</button><div class="dots">${dots}</div>
   ${G.mode==='boss'?`<span class="hearts">${[0,1,2].map(i=>im(i<G.hearts?'heart':'heart0')).join('')}</span>`:''}
   <span class="chip">${im(th().coin)} ${S.coins}</span></div>`}
function bindQuit(){$('#quit').onclick=()=>{save();render()}}
function next(){
  if(G.i>=G.queue.length||(G.mode==='boss'&&G.hearts<=0))return summary();
  G.locked=false;const q=G.queue[G.i];
  ({learn:learnCard,memory:memo,en2ru:ore,ru2en:fall,listen:maze,spell:spell,boss:boss})[G.mode](q);
}
function reward(en,field,coins,el){const w=S.words[en];w[field]++;w.ok++;w.last=Date.now();S.coins+=coins;G.coins+=coins;G.right++;beep(true);burst(el,4+coins*2);save()}
function penalty(q){const w=S.words[q.w.en];w.bad++;w.last=Date.now();if(G.mode!=='spell'&&G.mode!=='boss')w.c=Math.max(0,w.c-1);
  if(!q.retry&&G.mode!=='boss')G.queue.push({w:q.w,retry:true});beep(false);save()}
const sayBtn=(big)=>`<span class="row" style="justify-content:center"><button class="say ${big?'big':''}" id="say">${im('speaker')}${big?'':'Послушать'}</button><button class="say slow" id="slow" aria-label="Медленно">🐢 Медленно</button></span>`;
function bindSay(w){const a=$('#say'),b=$('#slow');if(a)a.onclick=()=>speak(w.en);if(b)b.onclick=()=>speak(w.en,true)}

function learnCard(q){
  const w=q.w;
  app.innerHTML=header()+`<div class="panel qcard">
    ${im(w.en,'pic',w.en)}<div class="word">${esc(w.en)}</div>${w.rd?`<div class="ipa">Читается: <b>${esc(w.rd)}</b></div>`:''}
    ${sayBtn()}
    <p style="font-size:22px;font-weight:800">${esc(w.ru)}</p>
    <p class="muted">Послушай и повтори слово вслух 2 раза</p></div>
    <button class="btn wide" id="nx">Запомнил(а)! Дальше</button>`;
  bindQuit();bindSay(w);speak(w.en);
  $('#nx').onclick=e=>{if(!S.words[w.en].seen){S.coins+=1;G.coins+=1}S.words[w.en].seen=1;G.right++;beep(true);burst(e.currentTarget,5);save();G.i++;setTimeout(next,250)};
}

/* ---------- Добыча руды / Откуси пирожное: стена блоков ---------- */
function ore(q){
  const w=q.w,mine=S.world==='mine';
  const opts=shuffle([w,...shuffle(WORDS.filter(x=>x!==w)).slice(0,Math.min(5,N-1))]);
  G.combo=G.combo||0;
  app.innerHTML=header()+`<div class="panel qcard compact">
    <div class="row" style="justify-content:center;gap:14px">${im(w.en,'pic sm',w.en)}<div style="text-align:left"><div class="word">${esc(w.en)}</div>${w.rd?`<div class="ipa">Читается: <b>${esc(w.rd)}</b></div>`:''}</div></div>
    ${sayBtn()}
    <p class="task">${mine?'⛏️ Разбей блок с правильным переводом':'😋 Откуси пирожное с правильным переводом'}</p>
    ${G.combo>=2?`<span class="combo">Комбо ×${G.combo>=4?3:2}</span>`:''}</div>
    <div class="wall">${opts.map((x,i)=>`<button class="ore v${i%5+1}" data-i="${i}"><span>${esc(x.ru)}</span></button>`).join('')}</div>
    <div class="feedback" id="fb"></div><div id="nxw"></div>`;
  bindQuit();bindSay(w);speak(w.en);
  app.querySelectorAll('.ore').forEach(b=>b.onclick=()=>{
    if(G.locked)return;G.locked=true;const pick=opts[+b.dataset.i];const fb=$('#fb');
    if(pick===w){G.combo++;const mult=G.combo>=4?3:G.combo>=2?2:1;b.classList.add('crack');
      setTimeout(()=>b.classList.add('broken'),220);reward(w.en,'c',mult,b);
      fb.className='feedback ok';fb.textContent=`${th().hit} +${mult}${mult>1?' (комбо!)':''}`;setTimeout(()=>{G.i++;next()},1100)}
    else{G.combo=0;b.classList.add('stone');app.querySelectorAll('.ore').forEach(o=>{if(opts[+o.dataset.i]===w)o.classList.add('right')});
      penalty(q);fb.className='feedback no';fb.textContent=`${mine?'Камень!':'Невкусно!'} ${w.en} — ${w.ru}`;speak(w.en);
      $('#nxw').innerHTML='<button class="btn wide" id="nx">Дальше</button>';$('#nx').onclick=()=>{G.i++;next()}}
  });
}

/* ---------- Ловля вагонеток / Ягодный дождь: падающие слова ---------- */
function fall(q){
  const w=q.w,mine=S.world==='mine';
  const n=Math.min(innerWidth<520?3:4,N);const opts=shuffle([w,...shuffle(WORDS.filter(x=>x!==w)).slice(0,n-1)]);
  const base=Math.max(3.4,6.2-G.i*0.3);
  app.innerHTML=header()+`<div class="panel qcard compact">
    <div class="row" style="justify-content:center;gap:14px">${im(w.en,'pic sm',w.ru)}<div class="word" style="font-size:28px">${esc(w.ru)}</div></div>
    <p class="task">${mine?'🛒 Поймай вагонетку с английским словом!':'🍓 Поймай ягодку с английским словом!'}</p></div>
    <div class="field" id="field">${opts.map((x,i)=>{const d=(base*(0.9+Math.random()*0.25)).toFixed(2),dl=(i*0.35+Math.random()*0.3).toFixed(2);
      return `<button class="faller" data-i="${i}" style="left:calc(${i*100/n}% + 4px);width:calc(${100/n}% - 8px);animation-duration:${d}s;animation-delay:${dl}s"><span>${esc(x.en)}</span></button>`}).join('')}
      <div class="floor"></div></div>
    <div class="feedback" id="fb"></div><div id="nxw"></div>`;
  bindQuit();
  const all=()=>app.querySelectorAll('.faller');
  const stop=()=>all().forEach(f=>f.style.animationPlayState='paused');
  const fail=(msg)=>{penalty(q);const fb=$('#fb');fb.className='feedback no';fb.textContent=`${msg} Правильно: ${w.en}`;speak(w.en);
    all().forEach(o=>{if(opts[+o.dataset.i]===w)o.classList.add('right')});
    $('#nxw').innerHTML='<button class="btn wide" id="nx">Дальше</button>';$('#nx').onclick=()=>{G.i++;next()}};
  all().forEach(b=>{
    b.addEventListener('animationend',()=>{if(G.locked||opts[+b.dataset.i]!==w)return;G.locked=true;stop();b.classList.add('landed');fail(mine?'Уехала!':'Упала!')});
    b.onclick=()=>{if(G.locked)return;G.locked=true;stop();const pick=opts[+b.dataset.i];
      if(pick===w){b.classList.add('caught');reward(w.en,'c',1,b);speak(w.en);const fb=$('#fb');fb.className='feedback ok';fb.textContent=`${th().hit} +1`;setTimeout(()=>{G.i++;next()},1000)}
      else{b.classList.add('no');fail(mine?'Не та!':'Не та ягодка!')}}
  });
}

/* ---------- Эхо пещеры / Заказ покупателя: путь на слух, выбор картинки ---------- */
function maze(q){
  const w=q.w,mine=S.world==='mine';
  const n=Math.min(3,N);const opts=shuffle([w,...shuffle(WORDS.filter(x=>x!==w)).slice(0,n-1)]);
  const steps=G.queue.map((_,i)=>`<span class="step ${i<G.i?'done':''} ${i===G.i?'here':''}">${i===G.i?im(mine?'pick':'unicorn'):''}</span>`).join('');
  app.innerHTML=header()+`<div class="track">${steps}<span class="goal">${im(mine?'gem':'c4')}</span></div>
    <div class="panel qcard compact">${sayBtn(true)}
    <p class="task">${mine?'👂 Послушай эхо и выбери правильный проход':'🔔 Покупатель просит… Подай нужное!'}</p></div>
    <div class="doors">${opts.map((x,i)=>`<button class="door" data-i="${i}" aria-label="Вариант ${i+1}">${im(x.en,'','')}</button>`).join('')}</div>
    <div class="feedback" id="fb"></div><div id="nxw"></div>`;
  bindQuit();bindSay(w);speak(w.en);
  app.querySelectorAll('.door').forEach(b=>b.onclick=()=>{
    if(G.locked)return;G.locked=true;const pick=opts[+b.dataset.i];const fb=$('#fb');
    app.querySelectorAll('.door').forEach(o=>{const x=opts[+o.dataset.i];o.insertAdjacentHTML('beforeend',`<span class="lbl">${esc(x.en)}</span>`)});
    if(pick===w){b.classList.add('open');reward(w.en,'c',1,b);fb.className='feedback ok';fb.textContent=mine?'Проход открыт! +1':'Покупатель доволен! +1';setTimeout(()=>{G.i++;next()},1300)}
    else{b.classList.add('dead');app.querySelectorAll('.door').forEach(o=>{if(opts[+o.dataset.i]===w)o.classList.add('open')});
      penalty(q);fb.className='feedback no';fb.textContent=`${mine?'Тупик!':'Не то!'} Это было: ${w.en} — ${w.ru}`;speak(w.en);
      $('#nxw').innerHTML='<button class="btn wide" id="nx">Дальше</button>';$('#nx').onclick=()=>{G.i++;next()}}
  });
}

/* ---------- Найди пару: картинка + слово ---------- */
function memo(q){
  const list=q.list,mine=S.world==='mine';
  const cards=shuffle(list.flatMap(w=>[{w,k:'p'},{w,k:'t'}]));
  let open=[],moves=0,found=0,busy=false;
  app.innerHTML=header()+`<div class="panel qcard compact"><p class="task">${mine?'🧰 Открывай сундуки и находи пары: картинка + слово':'🧁 Переворачивай пирожные и находи пары: картинка + слово'}</p>
    <p class="muted" id="mv">Ходов: 0 · пар: 0 из ${list.length}</p></div>
    <div class="memo">${cards.map((c,i)=>`<button class="mcard" data-i="${i}" aria-label="Карточка ${i+1}"><span class="back"></span><span class="front">${c.k==='p'?im(c.w.en,'',''):`<b>${esc(c.w.en)}</b>`}</span></button>`).join('')}</div>`;
  bindQuit();
  app.querySelectorAll('.mcard').forEach(b=>b.onclick=()=>{
    if(busy||b.classList.contains('up'))return;b.classList.add('up');const c=cards[+b.dataset.i];open.push([b,c]);
    if(c.k==='t')speak(c.w.en);
    if(open.length<2)return;moves++;const [[b1,c1],[b2,c2]]=open;open=[];
    if(c1.w===c2.w){found++;b1.classList.add('match');b2.classList.add('match');speak(c1.w.en);
      S.words[c1.w.en].seen=1;S.coins+=1;G.coins+=1;G.right++;beep(true);burst(b2,5);save();
      if(found===list.length){G.moves=moves;G.i=1;setTimeout(summary,900)}}
    else{busy=true;setTimeout(()=>{b1.classList.remove('up');b2.classList.remove('up');busy=false},900)}
    $('#mv').textContent=`Ходов: ${moves} · пар: ${found} из ${list.length}`;
  });
}

function choice(q){
  const w=q.w,m=G.mode;
  const opts=shuffle([w,...shuffle(WORDS.filter(x=>x!==w)).slice(0,3)]);
  const label=x=>m==='en2ru'?x.ru:x.en;
  let prompt;
  if(m==='en2ru')prompt=`${im(w.en,'pic',w.en)}<div class="word">${esc(w.en)}</div>${w.rd?`<div class="ipa">Читается: <b>${esc(w.rd)}</b></div>`:''}${sayBtn()}<p class="muted">Что это значит?</p>`;
  else if(m==='ru2en')prompt=`${im(w.en,'pic',w.ru)}<div class="word">${esc(w.ru)}</div><p class="muted">Как это по-английски?</p>`;
  else prompt=`${sayBtn(true)}<p class="muted">Послушай и выбери слово. Можно нажать ещё раз.</p>`;
  app.innerHTML=header()+`<div class="panel qcard">${prompt}</div>
    <div class="opts">${opts.map((x,i)=>`<button class="opt" data-i="${i}">${esc(label(x))}</button>`).join('')}</div>
    <div class="feedback" id="fb"></div><div id="nxw"></div>`;
  bindQuit();
  bindSay(w);
  if(m!=='ru2en')speak(w.en);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(G.locked)return;G.locked=true;const pick=opts[+b.dataset.i];
    app.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(opts[+o.dataset.i]===w)o.classList.add('ok')});
    const fb=$('#fb');
    if(pick===w){reward(w.en,'c',1,b);fb.className='feedback ok';fb.textContent=`${th().hit} +1`;if(m==='ru2en')speak(w.en);setTimeout(()=>{G.i++;next()},1000)}
    else{b.classList.add('no');penalty(q);fb.className='feedback no';fb.textContent=`${th().miss} ${w.en} ${w.rd?'['+w.rd+']':''} — ${w.ru}`;speak(w.en);
      if(m==='listen')$('.qcard').insertAdjacentHTML('afterbegin',im(w.en,'pic',w.en));
      $('#nxw').innerHTML='<button class="btn wide" id="nx">Дальше</button>';$('#nx').onclick=()=>{G.i++;next()}}
  });
}

function spell(q){
  const w=q.w,chars=[...w.en];
  const letters=shuffle(chars.map((c,i)=>({c,i})).filter(x=>x.c!==' '));
  const filled=[];
  const slotsIdx=chars.map((c,i)=>c===' '?-1:i).filter(i=>i>=0);
  function draw(){
    $('#slots').innerHTML=chars.map((c,i)=>{if(c===' ')return '<span class="slot gap"></span>';const k=slotsIdx.indexOf(i);
      return `<span class="slot">${filled[k]!=null?esc(letters[filled[k]].c):''}</span>`}).join('');
    $('#tiles').innerHTML=letters.map((l,i)=>`<button class="tile" style="--tc:${TILEC[i%TILEC.length]}" data-i="${i}" ${filled.includes(i)?'disabled':''}>${esc(l.c)}</button>`).join('');
    app.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(G.locked)return;filled.push(+b.dataset.i);draw();if(filled.length===slotsIdx.length)check()});
  }
  app.innerHTML=header()+`<div class="panel qcard">${im(w.en,'pic',w.ru)}<div class="word" style="font-size:28px">${esc(w.ru)}</div>
    <div class="row" style="justify-content:center">${sayBtn()}<button class="say" id="hint" style="background:#fff;box-shadow:0 4px 0 #ccc">💡 Подсказка</button></div><div class="ipa" id="hintx" hidden>${w.rd?'Читается: <b>'+esc(w.rd)+'</b>':'Первая буква: <b>'+esc(w.en[0])+'</b>'}</div><div class="slots" id="slots"></div></div>
    <div class="tiles" id="tiles"></div>
    <div class="row" style="justify-content:center"><button class="btn ghost" id="back">⌫ Стереть букву</button></div>
    <div class="feedback" id="fb"></div><div id="nxw"></div>`;
  bindQuit();bindSay(w);$('#hint').onclick=()=>{$('#hintx').hidden=false;speak(w.en)};
  $('#back').onclick=()=>{if(G.locked)return;filled.pop();draw()};
  draw();
  function check(){
    G.locked=true;const word=slotsIdx.map((_,k)=>letters[filled[k]].c).join('');const target=chars.filter(c=>c!==' ').join('');
    const fb=$('#fb');speak(w.en);
    if(word===target){reward(w.en,'s',2,$('#slots'));fb.className='feedback ok';fb.textContent=`${th().win} +2`;setTimeout(()=>{G.i++;next()},1200)}
    else{penalty(q);fb.className='feedback no';fb.textContent=`Правильно: ${w.en} ${w.rd?'['+w.rd+']':''}`;
      $('#nxw').innerHTML='<button class="btn wide" id="nx">Дальше</button>';$('#nx').onclick=()=>{G.i++;next()}}
  }
}

function boss(q){
  const w=q.w;let tries=0;
  app.innerHTML=header()+`<div class="panel qcard">${im(w.en,'pic',w.ru)}<div class="word">${esc(w.ru)}</div>
    <p class="muted">Напиши по-английски</p><button type="button" class="say" id="hint" style="background:#fff;box-shadow:0 4px 0 #ccc">💡 Подсказка</button><div class="ipa" id="hintx" hidden></div></div>
    <form id="f" style="display:grid;gap:12px"><input class="type" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" lang="en" placeholder="пиши по-английски">
    <button class="btn wide" type="submit">Проверить</button></form>
    <div class="feedback" id="fb"></div><div id="nxw"></div>`;
  bindQuit();const inp=$('#inp');inp.focus();let hinted=false;
  $('#hint').onclick=()=>{hinted=true;const h=$('#hintx');h.hidden=false;h.innerHTML=`${w.rd?'Читается: <b>'+esc(w.rd)+'</b><br>':''}Первая буква: <b>${esc(w.en[0])}</b> · букв: <b>${w.en.replace(/ /g,'').length}</b>`;speak(w.en);inp.focus()};
  $('#f').onsubmit=e=>{e.preventDefault();if(G.locked)return;const v=norm(inp.value);if(!v)return;
    const good=[w.en,...(w.alt||[])].map(norm);const fb=$('#fb');
    if(good.includes(v)){G.locked=true;reward(w.en,'t',hinted?1:3,inp);fb.className='feedback ok';fb.textContent=`${th().hit} +${hinted?1:3}`;speak(w.en);setTimeout(()=>{G.i++;next()},1100);return}
    if(tries===0&&lev(v,norm(w.en))<=1){tries++;fb.className='feedback';fb.textContent='Почти! Проверь одну букву';inp.select();return}
    G.locked=true;G.hearts--;penalty(q);fb.className='feedback no';fb.textContent=`Правильно: ${w.en} ${w.rd?'['+w.rd+']':''}`;speak(w.en);
    $('.hearts').innerHTML=[0,1,2].map(i=>im(i<G.hearts?'heart':'heart0')).join('');
    $('#nxw').innerHTML='<button class="btn wide" id="nx">Дальше</button>';$('#nx').onclick=()=>{G.i++;next()}};
}

function summary(){
  S.rounds++;save();
  const t=th(),fresh=WORDS.filter(x=>learned(x.en)&&!G.before.has(x.en));
  const lost=G.mode==='boss'&&G.hearts<=0;
  const answered=G.mode==='memory'?G.right:Math.min(G.i,G.queue.length);
  app.innerHTML=`<div class="panel sum">
    ${im(lost?'boom':(S.world==='mine'?'trophy':'party'),'bigimg')}
    <h2>${lost?'Жизни кончились! Трудные слова попадутся снова':'Раунд пройден!'}</h2>
    <p style="font-size:19px">${G.mode==='memory'?`Все пары найдены за <b>${G.moves}</b> ходов`:`Верно: <b>${G.right}</b> из ${answered}`}</p>
    <span class="chip">${im(t.coin)} +${G.coins}</span>
    ${fresh.length?`<p style="font-weight:900;font-size:19px">${S.world==='mine'?'Новые блоки в доме':'Новые кусочки пекарни'}: ${fresh.length}</p><div class="newlist">${fresh.map(x=>`<span>${im(x.en)} ${esc(x.en)}</span>`).join('')}</div>`:''}
    <p class="muted">Выучено всего ${learnedCount()} из ${N}</p>
    <div class="row" style="justify-content:center"><button class="btn" id="again">Ещё раунд</button><button class="btn ghost" id="home">${t.home}</button></div>
  </div>`;
  if(!lost)setTimeout(()=>burst($('.bigimg'),14),200);
  $('#again').onclick=()=>play(G.mode);$('#home').onclick=render;
}

if(API_URL){const c=lsGet('wq-code');c?doLogin(c,true):loginScreen('')}else{useUnit(S.unit);render()}
</script>
